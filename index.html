  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e:96px;line-height:.94;letter-spacing:-.022em;max-width:17ch;animation:rise .9s cubic-bezier(.22,1,.36,1) both\">Two halves of the same job.<\u002Fh1>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:420px 1fr;gap:64px;margin-top:72px;align-items:start\">\n<div data-reveal=\"up\">\n<div style=\"height:520px;border:1px solid rgba(22,23,15,.2);background:repeating-linear-gradient(135deg,#eae7dc 0 9px,#f1eee4 9px 18px);display:flex;align-items:flex-end;padding:20px\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(22,23,15,.5)\">[ portrait — 420 × 520 ]<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:30px;border-top:1px solid #16170f\">\n<sc-for list=\"{{ spec }}\" as=\"s\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(22,23,15,.14);font-family:'JetBrains Mono',monospace;font-size:12px\">\n<span style=\"color:rgba(22,23,15,.45)\">{{ s.k }}<\u002Fspan><span>{{ s.v }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-reveal=\"up\">\n<p style=\"margin:0;font-size:22px;line-height:1.55;color:rgba(22,23,15,.82);max-width:50ch\">One half of my work is the front end: sites people actually enjoy moving through, hand-coded rather than assembled from a template.<\u002Fp>\n<p style=\"margin:26px 0 0;font-size:17.5px;line-height:1.72;color:rgba(22,23,15,.7);max-width:56ch\">The other half is the machinery behind them — the systems quietly running the boring work. A birria pop-up's order queue. A health dashboard that reads a lab export and flags what matters. An email pipeline that builds and schedules itself. A trading cockpit that watches the market so nobody has to sit and watch charts.<\u002Fp>\n<p style=\"margin:26px 0 0;font-size:17.5px;line-height:1.72;color:rgba(22,23,15,.7);max-width:56ch\">Both halves answer the same brief: remove the manual step. Give me a messy repetitive process and I will turn it into something that runs itself, with an interface worth looking at on the front of it.<\u002Fp>\n\n<div style=\"margin-top:52px;padding-top:36px;border-top:1px solid #16170f\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(22,23,15,.5);margin-bottom:26px\">Capabilities<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0 40px\">\n<sc-for list=\"{{ caps }}\" as=\"c\" hint-placeholder-count=\"8\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(22,23,15,.14);font-family:'JetBrains Mono',monospace;font-size:12.5px\">\n<span>{{ c.t }}<\u002Fspan><span style=\"color:rgba(22,23,15,.35)\">{{ c.n }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:52px;padding:32px 0;border-top:1px solid #16170f;border-bottom:1px solid #16170f\">\n<div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1.2;max-width:26ch\">Get in contact for custom work.<\u002Fdiv>\n<a href=\"#\" sc-camel-on-click=\"{{ goContact }}\" style=\"cursor:pointer;display:inline-block;margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#7a3b1f;border-bottom:1px solid #7a3b1f;padding-bottom:6px\">Make an enquiry →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContact }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:0 48px\">\n<div style=\"padding:142px 0 0\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(22,23,15,.45);animation:fade .8s ease both\">Enquiries<\u002Fdiv>\n<h1 style=\"margin:22px 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:104px;line-height:.94;letter-spacing:-.022em;max-width:16ch;animation:rise .9s cubic-bezier(.22,1,.36,1) both\">Tell me which part is <em style=\"font-style:italic;color:#7a3b1f\">eating your time.<\u002Fem><\u002Fh1>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:72px;margin-top:64px;padding-top:44px;border-top:1px solid #16170f\">\n<div>\n<p style=\"margin:0;font-size:19px;line-height:1.65;color:rgba(22,23,15,.75);max-width:52ch\">Whether it is a site that should feel alive or a manual process that should not exist, the first conversation is the same: what happens today, step by step, and how often.<\u002Fp>\n<a href=\"mailto:{{ email }}\" data-reveal=\"up\" style=\"display:flex;align-items:center;justify-content:space-between;margin-top:44px;padding:30px 34px;background:#16170f;color:#f4f2ea\">\n<span style=\"font-family:'Instrument Serif',Georgia,serif;font-size:32px;letter-spacing:-.01em\">{{ email }}<\u002Fspan>\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d9c3b4\">Write to me ↵<\u002Fspan>\n<\u002Fa>\n<div style=\"display:flex;gap:34px;margin-top:26px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(22,23,15,.5)\">\n<span>Response within 2 working days<\u002Fspan><span>{{ availability }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-reveal=\"up\">\n<div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(22,23,15,.5);margin-bottom:22px\">What to include<\u002Fdiv>\n<sc-for list=\"{{ include }}\" as=\"i\" hint-placeholder-count=\"4\">\n<div style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid rgba(22,23,15,.16)\">\n<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#7a3b1f\">{{ i.n }}<\u002Fspan>\n<span style=\"font-size:15.5px;line-height:1.55;color:rgba(22,23,15,.72)\">{{ i.t }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:70px 48px 44px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-top:22px;border-top:1px solid rgba(22,23,15,.16);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(22,23,15,.45)\">\n<span>Built by hand · © 2026 Besfort Hyseni<\u002Fspan>\n<div style=\"display:flex;gap:26px\">\n<a href=\"mailto:{{ email }}\">{{ email }}<\u002Fa>\n<a href=\"#\" sc-camel-on-click=\"{{ goTop }}\" style=\"cursor:pointer\">Top ↑<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;besforth@icloud.com&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;availability&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open to work&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;on&quot;,&quot;off&quot;],&quot;default&quot;:&quot;on&quot;,&quot;tsType&quot;:&quot;\\&quot;on\\&quot; | \\&quot;off\\&quot;&quot;},&quot;showPersonal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: \"home\", idx: 0 };\n  progressRef = React.createRef();\n\n  go(screen, idx) {\n    this.setState({ screen, idx: idx == null ? this.state.idx : idx });\n    window.scrollTo(0, 0);\n  }\n\n  componentDidMount() {\n    this.onScroll = () => {\n      const el = this.progressRef.current;\n      if (!el) return;\n      const h = document.documentElement.scrollHeight - window.innerHeight;\n      el.style.width = (h > 0 ? Math.min(1, window.scrollY / h) * 100 : 0) + \"%\";\n    };\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        el.style.opacity = \"1\";\n        el.style.transform = \"none\";\n        this.io.unobserve(el);\n        el.querySelectorAll(\"[data-count]\").forEach((c) => this.count(c));\n      });\n    }, { rootMargin: \"0px 0px -8% 0px\", threshold: 0.05 });\n    this.wire();\n    document.querySelectorAll(\"[data-count]\").forEach((c) => {\n      if (c.getBoundingClientRect().top < window.innerHeight) setTimeout(() => this.count(c), 450);\n    });\n  }\n\n  componentDidUpdate() { this.wire(); }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this.onScroll);\n    if (this.io) this.io.disconnect();\n  }\n\n  wire() {\n    if ((this.props.motion ?? \"on\") === \"off\") return;\n    if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    document.querySelectorAll(\"[data-reveal]:not([data-wired])\").forEach((el, i) => {\n      el.setAttribute(\"data-wired\", \"1\");\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.92) return;\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(18px)\";\n      el.style.transition = \"opacity .75s cubic-bezier(.22,1,.36,1) \" + Math.min(i * 45, 180) + \"ms, transform .75s cubic-bezier(.22,1,.36,1) \" + Math.min(i * 45, 180) + \"ms\";\n      this.io.observe(el);\n    });\n  }\n\n  count(el) {\n    if (el.dataset.done) return;\n    el.dataset.done = \"1\";\n    const to = parseFloat(el.dataset.count);\n    const pre = el.dataset.prefix || \"\";\n    const suf = el.dataset.suffix || \"\";\n    const pad = parseInt(el.dataset.pad || \"0\", 10);\n    const t0 = performance.now();\n    const tick = (t) => {\n      const k = Math.min(1, (t - t0) / 1100);\n      const v = Math.round(to * (1 - Math.pow(1 - k, 3)));\n      el.textContent = pre + (pad ? String(v).padStart(pad, \"0\") : v) + suf;\n      if (k < 1) requestAnimationFrame(tick);\n    };\n    el.textContent = pre + (pad ? \"0\".repeat(pad) : \"0\") + suf;\n    requestAnimationFrame(tick);\n  }\n\n  renderVals() {\n    const shots = {\n      \"birria-birria\": \"https://image.thum.io/get/width/1600/crop/1000/noanimate/https://www.birriabirria.co.uk/\",\n      \"blood-panel\": \"assets/screenshots/bloodtests.png\",\n      \"adobe-emails\": \"assets/screenshots/abode.png\",\n      \"trading-bot\": \"assets/screenshots/TradingBot.png\"\n    };\n    const data = [\n      {\n        slug: \"birria-birria\", no: \"001\", title: \"Birria Birria\", category: \"hospitality · ordering & ops\",\n        short: \"Scattered DMs, online orders and walk-ups funnelled into one live prep queue.\",\n        role: \"Design, front end,\\nautomation\", stack: \"Ordering site, n8n,\\nwebhook + messaging APIs,\\nGoogle Sheets\",\n        state: \"Running\", host: \"www.birriabirria.co.uk\", url: \"https://www.birriabirria.co.uk/\",\n        summary: \"An order-to-kitchen system for a birria pop-up that turns scattered DMs and online orders into a single live prep queue.\",\n        problem: \"Orders arrived from three directions at once — the website, Instagram DMs and the counter — and were reconciled by hand on a busy service. Tickets went missing, prep order was guesswork, and the end-of-day totals were rebuilt from memory and a calculator.\",\n        steps: [\n          { n: \"01\", t: \"A responsive ordering front end takes online orders and normalises every incoming ticket into the same shape, whatever channel it arrived from.\" },\n          { n: \"02\", t: \"An n8n pipeline listens on webhooks, merges the channels, and sorts the queue by prep time rather than arrival order.\" },\n          { n: \"03\", t: \"The kitchen reads one live prep list; customers receive automatic status messages; sales and stock roll into a sheet at close with no manual entry.\" }\n        ],\n        impact: \"Order-handling time per ticket fell sharply, and the lost-DM problem on busy nights disappeared entirely.\",\n        p1: \"order channels\", p2: \"n8n queue\", p3: \"kitchen\",\n        caption: \"Fig. 01 — ordering front end and live prep queue\"\n      },\n      {\n        slug: \"blood-panel\", no: \"002\", title: \"Blood Testing Panel\", category: \"health · data & reporting\",\n        short: \"Raw lab exports turned into a colour-coded, trend-aware health panel.\",\n        role: \"Design, front end,\\ndata layer\", stack: \"Parsing layer,\\ninteractive charting,\\nreference-range engine,\\nPDF reports\",\n        state: \"Running\", host: \"Private\",\n        summary: \"A blood-panel dashboard that ingests lab results and turns rows of numbers into a readable, colour-coded health story.\",\n        problem: \"Lab results arrive as dense PDFs. Reading them meant scanning a table of markers against reference ranges by eye, highlighting anything unusual, and having no view at all of how a value had moved since the last test.\",\n        steps: [\n          { n: \"01\", t: \"A parsing layer reads raw panel exports and maps every marker onto its healthy reference range.\" },\n          { n: \"02\", t: \"Each marker is plotted, flagged green, amber or red, and tracked across previous tests so direction of travel is visible.\" },\n          { n: \"03\", t: \"A report generator produces a shareable PDF of the same view for a clinician or for personal records.\" }\n        ],\n        impact: \"A manual, error-prone reading exercise became a single upload that anyone can understand at a glance.\",\n        p1: \"lab export\", p2: \"range engine\", p3: \"dashboard\",\n        caption: \"Fig. 01 — marker view with reference ranges and flags\"\n      },\n      {\n        slug: \"adobe-emails\", no: \"003\", title: \"Adobe Email Automations\", category: \"marketing · email ops\",\n        short: \"A templated email production line: content in, branded sends out.\",\n        role: \"Automation design,\\nimplementation\", stack: \"Templating engine,\\nasset automation,\\nscheduling logic,\\nAdobe + email APIs\",\n        state: \"Running\", host: \"Private\",\n        summary: \"An email production pipeline that automates the repetitive build work — templating, asset handling and dispatch, at scale.\",\n        problem: \"Every campaign email was assembled by hand: copy pasted into a layout, assets located and resized one by one, then scheduled manually. The work was hours long, entirely repeatable, and inconsistent in its branding.\",\n        steps: [\n          { n: \"01\", t: \"Templated layouts populate directly from a content source, so copy is written once and never pasted.\" },\n          { n: \"02\", t: \"Assets are pulled and resized automatically to the sizes each placement requires.\" },\n          { n: \"03\", t: \"Approved emails schedule themselves out through the existing stack — no manual dispatch step.\" }\n        ],\n        impact: \"A multi-hour manual build became a near-instant repeatable run, with consistent branding every time.\",\n        p1: \"content source\", p2: \"templating\", p3: \"scheduled send\",\n        caption: \"Fig. 01 — templated email build and dispatch view\"\n      },\n      {\n        slug: \"trading-bot\", no: \"004\", title: \"Trading Tool\", category: \"fintech · data & signals\",\n        short: \"Live market data, configurable rules, and one screen of clean signals.\",\n        role: \"Design, front end,\\nalerting layer\", stack: \"Market-data APIs,\\nreal-time charting,\\nalerting layer,\\nconfigurable rules\",\n        state: \"Running\", host: \"Private\",\n        summary: \"A trading tool that pulls live market data, runs a configurable rule set, and surfaces clean signals on a single screen.\",\n        problem: \"Watching for setups meant keeping ten browser tabs open and reading charts manually. Decisions were made on a fragmented view, and anything that happened away from the screen was simply missed.\",\n        steps: [\n          { n: \"01\", t: \"Live market data is ingested continuously from provider APIs into one normalised feed.\" },\n          { n: \"02\", t: \"A configurable set of indicators and rules is evaluated against the feed in real time.\" },\n          { n: \"03\", t: \"Matches surface as alerts and a focused watchlist, so the screen shows conclusions rather than raw charts.\" }\n        ],\n        impact: \"Scattered manual chart-watching consolidated into one automated, alert-driven cockpit.\",\n        p1: \"market APIs\", p2: \"rule engine\", p3: \"alerts\",\n        caption: \"Fig. 01 — signals cockpit and watchlist\"\n      }\n    ];\n    const projects = data.map((p, i) => Object.assign({}, p, {\n      shot: shots[p.slug] || \"\",\n      hasShot: !!shots[p.slug],\n      noShot: !shots[p.slug],\n      hasUrl: !!p.url,\n      noUrl: !p.url,\n      open: () => this.go(\"case\", i)\n    }));\n    const cur = projects[this.state.idx] || projects[0];\n    const nxt = projects[(this.state.idx + 1) % projects.length];\n    const s = this.state.screen;\n    return {\n      projects,\n      cur,\n      nxt,\n      isHome: s === \"home\", isWork: s === \"work\", isCase: s === \"case\", isAbout: s === \"about\", isContact: s === \"contact\",\n      goHome: (e) => { e.preventDefault(); this.go(\"home\"); },\n      goWork: (e) => { e.preventDefault(); this.go(\"work\"); },\n      goAbout: (e) => { e.preventDefault(); this.go(\"about\"); },\n      goContact: (e) => { e.preventDefault(); this.go(\"contact\"); },\n      goTop: (e) => { e.preventDefault(); window.scrollTo(0, 0); },\n      goNext: () => this.go(\"case\", (this.state.idx + 1) % projects.length),\n      progressRef: this.progressRef,\n      email: this.props.email ?? \"besforth@icloud.com\",\n      availability: this.props.availability ?? \"Open to work\",\n      personal: (this.props.showPersonal ?? true) ? [\n        { no: \"006\", title: \"Movie / Series Picker\", category: \"personal · web app\", state: \"Live\", short: \"Tell it your mood, time and company; it narrows thousands of titles to one confident pick.\" },\n        { no: \"007\", title: \"Birthday Surprise\", category: \"personal · interactive\", state: \"Private\", short: \"An interactive, scroll-driven web gift — pure interaction craft, no template.\" }\n      ] : [],\n      spec: [\n        { k: \"Role\", v: \"Web developer & automation builder\" },\n        { k: \"Stack\", v: \"Vanilla JS · n8n · APIs · Webhooks\" },\n        { k: \"Focus\", v: \"Interactive UX + workflow automation\" },\n        { k: \"Approach\", v: \"Hand-coded, no templates\" },\n        { k: \"Builds\", v: \"6 shipped · ~40h/week returned\" },\n        { k: \"Status\", v: this.props.availability ?? \"Open to work\" }\n      ],\n      caps: [\n        { t: \"Interactive front end\", n: \"01\" }, { t: \"Workflow automation\", n: \"02\" },\n        { t: \"n8n pipelines\", n: \"03\" }, { t: \"API integration\", n: \"04\" },\n        { t: \"Webhook systems\", n: \"05\" }, { t: \"Data dashboards\", n: \"06\" },\n        { t: \"Email systems\", n: \"07\" }, { t: \"Ordering & ops tooling\", n: \"08\" }\n      ],\n      include: [\n        { n: \"01\", t: \"The process as it happens today, step by step.\" },\n        { n: \"02\", t: \"How often it runs, and roughly how long it takes each time.\" },\n        { n: \"03\", t: \"Which tools are already in use — sheets, inboxes, CRMs, anything.\" },\n        { n: \"04\", t: \"What a good outcome looks like, in your words.\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
