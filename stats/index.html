<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Visitors — besiserver.co.uk</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light;
  --plane:      #f7f6f1;
  --surface:    #fdfdfb;
  --ink:        #0b0b0b;
  --ink-2:      #52514e;
  --muted:      #898781;
  --grid:       #e1e0d9;
  --axis:       #c3c2b7;
  --hairline:   rgba(11,11,11,0.10);
  --series-1:   #2a78d6;
  --series-2:   #eb6834;
  --land:       #e8e7e0;
  --good:       #006300;
  --shadow:     0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:    #0d0d0d;
    --surface:  #17171a;
    --ink:      #ffffff;
    --ink-2:    #c3c2b7;
    --muted:    #898781;
    --grid:     #2c2c2a;
    --axis:     #383835;
    --hairline: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --land:     #26262a;
    --good:     #0ca30c;
    --shadow:   none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #17171a; --ink: #fff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --hairline: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-2: #d95926; --land: #26262a; --good: #0ca30c;
  --shadow: none;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

/* ---------------------------------------------------------------- chrome */
.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
.top h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--hairline); border-radius: 9px; padding: 2px; }
.seg button {
  font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-2);
  padding: 5px 11px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--plane); color: var(--ink); font-weight: 600; }
.btn {
  font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 9px; cursor: pointer;
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--hairline);
}
.btn:hover { color: var(--ink); }

/* ----------------------------------------------------------------- cards */
.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow);
}
.card h2 { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
.card .hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card > header { margin-bottom: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: 1fr 1fr; }
.cols-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }

/* ------------------------------------------------------------ stat tiles */
.hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; }
.hero .fig { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.hero .cap { color: var(--ink-2); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 1px; background: var(--hairline); border-radius: 12px; overflow: hidden; margin-top: 18px; }
.tile { background: var(--surface); padding: 13px 15px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 3px; }
.tile .n { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

/* --------------------------------------------------------------- legends */
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend i { width: 14px; height: 2px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }

/* ---------------------------------------------------------------- tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 8px 7px 0; border-bottom: 1px solid var(--grid); }
td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-cell { width: 34%; min-width: 90px; }
.bar { height: 8px; border-radius: 0 4px 4px 0; background: var(--series-1); }
.label { display: block; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dim { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px; border: 1px solid var(--hairline); color: var(--ink-2); }

/* ------------------------------------------------------------------- map */
.map-wrap { position: relative; }
.map { width: 100%; height: auto; display: block; overflow: visible; }
.dot { fill: var(--series-1); fill-opacity: .78; stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.dot:hover { fill-opacity: 1; }

/* --------------------------------------------------------------- tooltip */
.tip {
  position: fixed; z-index: 40; pointer-events: none; opacity: 0;
  background: var(--surface); color: var(--ink); border: 1px solid var(--hairline);
  border-radius: 9px; padding: 8px 11px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 4px 20px rgba(0,0,0,.16); transition: opacity .1s; max-width: 280px;
}
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ feed */
.feed { max-height: 460px; overflow-y: auto; }
.feed td { white-space: nowrap; }

/* ------------------------------------------------------------- gate/msgs */
.gate { max-width: 380px; margin: 14vh auto; }
.gate .card { padding: 26px; }
.gate h1 { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
.gate p { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }
.gate input {
  width: 100%; font: inherit; padding: 10px 12px; border-radius: 9px;
  border: 1px solid var(--hairline); background: var(--plane); color: var(--ink); margin-bottom: 10px;
}
.gate button { width: 100%; padding: 10px; font-weight: 600; color: var(--ink); }
.err { color: #d03b3b; font-size: 13px; margin-top: 10px; }
.setup { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 22px; }
.setup code { font-family: ui-monospace, monospace; background: var(--plane); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 10px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<!-- password gate ------------------------------------------------------- -->
<div class="gate" id="gate">
  <div class="card">
    <h1>Visitor stats</h1>
    <p>besiserver.co.uk</p>
    <form id="gateForm">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
      <button class="btn" type="submit">View stats</button>
    </form>
    <div class="err" id="gateErr" hidden></div>
  </div>
</div>

<!-- dashboard ----------------------------------------------------------- -->
<div class="wrap" id="app" hidden>
  <div class="top">
    <div>
      <h1>Visitors</h1>
      <div class="sub" id="rangeNote">—</div>
    </div>
    <div class="controls">
      <div class="seg" id="rangeSeg">
        <button data-days="1">24h</button>
        <button data-days="7">7d</button>
        <button data-days="30" aria-pressed="true">30d</button>
        <button data-days="90">90d</button>
        <button data-days="all">All</button>
      </div>
      <button class="btn" id="botsBtn" aria-pressed="false">Bots off</button>
      <button class="btn" id="themeBtn" title="Toggle theme">◐</button>
      <button class="btn" id="reloadBtn">Refresh</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<div class="tip" id="tip"></div>

  if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
  return nf.format(n);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
let regionNames = null;
try { regionNames = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
function country(cc) {
  if (!cc || cc === "??" || cc.length !== 2) return "Unknown";
  try { return regionNames ? regionNames.of(cc) : cc; } catch (e) { return cc; }
}
function flag(cc) {
  if (!cc || cc.length !== 2 || !/^[A-Z]{2}$/i.test(cc)) return "🌐";
  return String.fromCodePoint(...cc.toUpperCase().split("").map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
}
function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 604800) return Math.floor(s / 86400) + "d ago";
  return new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
function secs(v) {
  v = Math.round(Number(v) || 0);
  if (v < 60) return v + "s";
  return Math.floor(v / 60) + "m " + String(v % 60).padStart(2, "0") + "s";
}

/* ---------------------------------------------------------------- tooltip */
const tip = $("#tip");
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top < 8) top = y + 18;
  tip.style.left = Math.max(8, left) + "px";
  tip.style.top = top + "px";
}
function hideTip() { tip.style.opacity = "0"; }

/* ------------------------------------------------------------------ fetch */
async function load() {
  const url = `/api/stats?days=${encodeURIComponent(DAYS)}&bots=${BOTS ? 1 : 0}&limit=200`;
  const res = await fetch(url, { headers: { Authorization: "Bearer " + KEY }, cache: "no-store" });
  if (res.status === 401) { const e = new Error("Wrong password."); e.auth = true; throw e; }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status}).`);
  return body;
}

async function refresh() {
  try {
    DATA = await load();
    render(DATA);
  } catch (err) {
    if (err.auth) { KEY = ""; sessionStorage.removeItem("bes.key"); gate(err.message); return; }
    $("#content").innerHTML =
      `<div class="setup"><h2>Not ready yet</h2><p class="hint" style="margin-top:8px">${esc(err.message)}</p>
       <p class="hint" style="margin-top:12px">Check <code>/api/health</code> to see which binding is missing, and ANALYTICS.md for the setup steps.</p></div>`;
  }
}

/* ------------------------------------------------------------------- gate */
function gate(msg) {
  $("#app").hidden = true;
  $("#gate").hidden = false;
  const e = $("#gateErr");
  e.hidden = !msg;
  e.textContent = msg || "";
}
$("#gateForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  KEY = $("#pw").value;
  sessionStorage.setItem("bes.key", KEY);
  $("#gate").hidden = true;
  $("#app").hidden = false;
  await refresh();
});

/* ------------------------------------------------------------------ chart */
/* Two series, one axis, 2px lines, hairline grid, legend + end labels. */
function lineChart(daily) {
  if (!daily || daily.length === 0) return `<p class="empty">No visits recorded in this period yet.</p>`;

  const W = 1000, H = 250, L = 46, R = 76, T = 14, B = 28;
  const iw = W - L - R, ih = H - T - B;
  const series = [
    { key: "visitors",  name: "Visitors",  color: "var(--series-1)" },
    { key: "pageviews", name: "Page views", color: "var(--series-2)" }
  ];

  let max = 0;
  daily.forEach((d) => series.forEach((s) => { max = Math.max(max, Number(d[s.key]) || 0); }));

  /* Ticks land on whole, readable numbers (0/5/10/15), never 3.75/11.25.
     These are people-counts, so the step never goes below 1. */
  const rough = Math.max(max, 1) / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const step = Math.max(1, (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag);
  const top = Math.max(step, Math.ceil(Math.max(max, 1) / step) * step);

  const n = daily.length;
  const x = (i) => L + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = (v) => T + ih - (Number(v) || 0) / top * ih;

  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);
  const grid = ticks.map((v) =>
    `<line x1="${L}" x2="${L + iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
     <text x="${L - 9}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`
  ).join("");

  const marks = series.slice().reverse().map((s) => {
    const pts = daily.map((d, i) => `${x(i).toFixed(1)},${y(d[s.key]).toFixed(1)}`).join(" ");
    const last = daily[n - 1];
    const lx = x(n - 1), ly = y(last[s.key]);
    const dots = n === 1
      ? `<circle cx="${lx}" cy="${ly}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>` : "";
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>${dots}
            <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>
            <text x="${(lx + 11).toFixed(1)}" y="${(ly + 4).toFixed(1)}" font-size="12" fill="var(--ink)" font-weight="600">${fmt(last[s.key])}</text>`;
  }).join("");

  const dLabel = (i) => new Date(daily[i].day + "T00:00:00Z")
    .toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  const idx = n === 1 ? [0] : n < 4 ? daily.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
  const xlabels = idx.map((i) =>
    `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}"
       font-size="11" fill="var(--muted)">${dLabel(i)}</text>`).join("");

  const rows = daily.map((d) =>
    `<tr><td>${dLabel(daily.indexOf(d))}</td><td class="num">${nf.format(d.visitors)}</td>
     <td class="num">${nf.format(d.pageviews)}</td><td class="num">${nf.format(d.clicks)}</td></tr>`).join("");

  return `
  <div class="legend" style="margin-bottom:10px">
    ${series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}
  </div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" id="tsChart"
       role="img" aria-label="Visitors and page views per day">
    ${grid}
    <line x1="${L}" x2="${L + iw}" y1="${T + ih}" y2="${T + ih}" stroke="var(--axis)" stroke-width="1"/>
    ${marks}${xlabels}
    <line id="tsCross" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>
    <rect id="tsHit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>
  </svg>
  <details style="margin-top:12px">
    <summary class="hint" style="cursor:pointer">Table view</summary>
    <table style="margin-top:10px"><thead><tr><th>Day</th><th class="num">Visitors</th>
      <th class="num">Page views</th><th class="num">Clicks</th></tr></thead><tbody>${rows}</tbody></table>
  </details>`;
}

function wireChart(daily) {
  const svg = $("#tsChart"); if (!svg || !daily.length) return;
  const hit = $("#tsHit"), cross = $("#tsCross");
  const W = 1000, L = 46, R = 76, iw = W - L - R, n = daily.length;

  function at(ev) {
    const box = svg.getBoundingClientRect();
    const px = ((ev.clientX - box.left) / box.width) * W;
    const i = n === 1 ? 0 : Math.round(((px - L) / iw) * (n - 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  hit.addEventListener("mousemove", (ev) => {
    const i = at(ev), d = daily[i];
    const cx = L + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", "1");
    const day = new Date(d.day + "T00:00:00Z").toLocaleDateString("en-GB",
      { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
    showTip(`<b>${day}</b>
      <div class="r"><span><i style="display:inline-block;width:10px;height:2px;background:var(--series-1);vertical-align:middle;margin-right:6px"></i>Visitors</span><span>${nf.format(d.visitors)}</span></div>
      <div class="r"><span><i style="display:inline-block;width:10px;height:2px;background:var(--series-2);vertical-align:middle;margin-right:6px"></i>Page views</span><span>${nf.format(d.pageviews)}</span></div>
      <div class="r"><span class="dim">Clicks</span><span>${nf.format(d.clicks)}</span></div>`,
      ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", "0"); hideTip(); });
}

/* -------------------------------------------------------------------- map */
function worldMap(points) {
  const pts = (points || []).filter((p) => p.lat != null && p.lon != null);
  const max = pts.reduce((m, p) => Math.max(m, p.visitors), 0) || 1;
  const px = (lon) => ((Number(lon) + 180) / 360) * MAP_W;
  const py = (lat) => ((LAT_TOP - Number(lat)) / (LAT_TOP - LAT_BOT)) * MAP_H;

  const dots = pts.map((p, i) => {
    const r = 4 + Math.sqrt(p.visitors / max) * 11;
    return `<circle class="dot" data-i="${i}" cx="${px(p.lon).toFixed(1)}" cy="${py(p.lat).toFixed(1)}" r="${r.toFixed(1)}"/>`;
  }).join("");

  return {
    html: `<div class="map-wrap">
      <svg class="map" viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="Map of where visitors connected from">
        <path d="${WORLD_PATH}" fill="var(--land)"/>
        <g id="mapDots">${dots}</g>
      </svg>
      ${pts.length ? "" : '<p class="empty">No located visits yet.</p>'}
    </div>`,
    pts
  };
}

function wireMap(pts) {
  $$("#mapDots .dot").forEach((dot) => {
    const p = pts[Number(dot.dataset.i)];
    dot.addEventListener("mouseenter", (ev) => {
      showTip(`<b>${flag(p.country)} ${esc(p.city || country(p.country))}</b>
        <div class="r"><span class="dim">${esc(country(p.country))}</span><span>${nf.format(p.visitors)} ${p.visitors === 1 ? "visitor" : "visitors"}</span></div>`,
        ev.clientX, ev.clientY);
    });
    dot.addEventListener("mousemove", (ev) => { tip.style.left = Math.max(8, ev.clientX + 14) + "px"; });
    dot.addEventListener("mouseleave", hideTip);
  });
}

/* --------------------------------------------------------- generic tables */
function barTable(rows, cols, opts) {
  opts = opts || {};
  if (!rows || !rows.length) return `<p class="empty">${opts.empty || "Nothing here yet."}</p>`;
  const metric = opts.metric || "visitors";
  const max = rows.reduce((m, r) => Math.max(m, Number(r[metric]) || 0), 0) || 1;
  const head = cols.map((c) => `<th class="${c.num ? "num" : ""}">${esc(c.head)}</th>`).join("");
  const body = rows.map((r) => {
    const cells = cols.map((c) => `<td class="${c.num ? "num" : ""}">${c.cell(r)}</td>`).join("");
    const w = ((Number(r[metric]) || 0) / max) * 100;
    return `<tr>${cells}<td class="bar-cell"><div class="bar" style="width:${Math.max(2, w).toFixed(1)}%"></div></td></tr>`;
  }).join("");
  return `<table><thead><tr>${head}<th></th></tr></thead><tbody>${body}</tbody></table>`;
}

/* Reads each event type back in plain words for the live feed. */
function feedDetail(r) {
  if (r.type === "engage") return `stayed ${esc(secs(r.value))}, reached ${r.scroll || 0}% down`;
  if (r.type === "scroll") return `scrolled ${r.value}% down`;
  if (r.label) return esc(r.label);
  if (r.href)  return `<span class="mono">${esc(String(r.href).replace(/^https?:\/\//, ""))}</span>`;
  return '<span class="dim">—</span>';
}

  const map = worldMap(d.points);

  $("#content").innerHTML = `
    <div class="grid" style="margin-bottom:14px">

          <div class="cap">${(t.visitors === 1 ? "person" : "people")} visited in the ${rangeLabel}</div>
        </div>
        <div class="tiles">
          ${tile("Sessions", fmt(t.sessions || 0), "separate visits")}
          ${tile("Page views", fmt(t.pageviews || 0), "")}
          ${tile("Link clicks", fmt(t.clicks || 0), `${fmt(t.outbound || 0)} left the site`)}
          ${tile("Email clicks", fmt(t.emails || 0), "tapped your address")}
          ${tile("Countries", fmt(t.countries || 0), "")}
          ${tile("Time on page", eng.avg_seconds ? secs(eng.avg_seconds) : "—", eng.samples ? `${fmt(eng.samples)} measured` : "no samples yet")}
          ${tile("Scroll depth", eng.avg_scroll != null ? Math.round(eng.avg_scroll) + "%" : "—", "average furthest point")}
          ${tile("Returning", retPct + "%", `${fmt(ret.returning_visitors || 0)} came back`)}
        </div>
      </div>
    </div>

    <div class="grid" style="margin-bottom:14px">
      <div class="card">
        <header><div><h2>Over time</h2><div class="hint">Unique people and page views, per day</div></div></header>
        ${lineChart(d.daily)}
      </div>
    </div>

    <div class="grid cols-2" style="margin-bottom:14px">
      <div class="card">
        <header><div><h2>Where in the world</h2><div class="hint">Each dot is a place people connected from — size is how many</div></div></header>
        ${map.html}
      </div>
      <div class="card">
        <header><div><h2>Countries</h2><div class="hint">Ranked by unique people</div></div></header>
        ${barTable(d.countries, [
          { head: "Country", cell: (r) => `${flag(r.country)} ${esc(country(r.country))}` },
          { head: "People", num: true, cell: (r) => nf.format(r.visitors) },
          { head: "Clicks", num: true, cell: (r) => `<span class="dim">${nf.format(r.clicks)}</span>` }
        ], { empty: "No located visits yet." })}

    </div>

    <div class="grid cols-2" style="margin-bottom:14px">
      <div class="card">
        <header><div><h2>Cities</h2><div class="hint">Edge-level accuracy — the city Cloudflare routed them from</div></div></header>
        ${barTable(d.cities, [
          { head: "City", cell: (r) => `${flag(r.country)} ${esc(r.city)}${r.region ? `<span class="dim">, ${esc(r.region)}</span>` : ""}` },
          { head: "People", num: true, cell: (r) => nf.format(r.visitors) }
        ], { empty: "No city data yet." })}
      </div>
      <div class="card">
        <header><div><h2>Networks</h2><div class="hint">The ISP or company network each visit came from</div></div></header>

        ${barTable(d.sections, [
          { head: "Section / page", cell: (r) => `<span class="label">${esc(r.label)}</span>` },

        ${barTable(d.systems, [{ head: "OS", cell: (r) => esc(r.name) },

    </div>

    <div class="grid">
      <div class="card">
        <header><div><h2>Live feed</h2><div class="hint">Every raw event, newest first — this is the actual data, not a rollup</div></div></header>

          ${(d.feed && d.feed.length) ? `<table><thead><tr>
            <th>When</th><th>What</th><th>Detail</th><th>Where</th><th>Device</th></tr></thead><tbody>
            ${d.feed.map((r) => `<tr>
              <td class="dim" title="${esc(new Date(r.ts).toLocaleString("en-GB"))}">${ago(r.ts)}</td>
              <td><span class="pill">${esc(r.type)}</span>${r.new_visitor ? ' <span class="pill" style="color:var(--good)">new</span>' : ""}</td>
              <td><span class="label">${feedDetail(r)}</span></td>
              <td class="dim">${flag(r.country)} ${esc(r.city || country(r.country))}${r.tag ? ` <span class="pill mono">?r=${esc(r.tag)}</span>` : ""}</td>
              <td class="dim">${esc([r.browser, r.os].filter(Boolean).join(" · ") || "—")}</td>
            </tr>`).join("")}
          </tbody></table>` : `<p class="empty">Nothing yet. Open besiserver.co.uk in another tab and it will appear here.</p>`}
        </div>
      </div>
    </div>`;

  wireChart(d.daily || []);
  wireMap(map.pts);
}

  const b = ev.target.closest("button[data-days]"); if (!b) return;
  DAYS = b.dataset.days;
  $$("#rangeSeg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  refresh();
});
$("#botsBtn").addEventListener("click", (ev) => {
  BOTS = !BOTS;
  ev.currentTarget.setAttribute("aria-pressed", String(BOTS));
  ev.currentTarget.textContent = BOTS ? "Bots on" : "Bots off";
  refresh();
});
$("#reloadBtn").addEventListener("click", refresh);
$("#themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("bes.stats.theme", dark ? "light" : "dark"); } catch (e) {}
});
try {
  const saved = localStorage.getItem("bes.stats.theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) {}

/* Refresh while the tab is open, but never in the background. */
setInterval(() => { if (!document.hidden && KEY && !$("#app").hidden) refresh(); }, 60000);

if (KEY) { $("#gate").hidden = true; $("#app").hidden = false; refresh(); } else { gate(""); }
</script>
